<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEADI - Login Premium</title>
    <link rel="stylesheet" href="css/fonts.css">
    <link rel="stylesheet" href="css/auth.css?v=7">
</head>
<body>

    <div class="ambient-light"></div>

    <main class="main-wrapper">
        <div class="login-card">
            <header class="card-header">
                <img src="img/seadi_1.png" alt="Logo SEADI" class="main-logo">
                <div class="brand-info">
                    <p class="tagline">Educação Digital Inteligente</p>
                    <h1 class="title">Portal do Aluno</h1>
                </div>
            </header>

            <form class="login-form">
                <div class="input-group">
                    <label class="field-label" for="email">Email <span class="req" aria-hidden="true">*</span></label>
                    <input type="email" id="email" name="email" placeholder="Digite seu email" required autocomplete="email" inputmode="email">
                </div>
                
                <div class="input-group">
                    <label class="field-label" for="password">Senha <span class="req" aria-hidden="true">*</span></label>
                    <div class="pw-field">
                        <input type="password" id="password" name="password" class="pw-input" placeholder="Digite sua senha" required autocomplete="current-password">
                        <button type="button" class="pw-toggle" onclick="togglePw('password')" aria-label="Mostrar senha" title="Mostrar senha" aria-pressed="false" aria-controls="password">
                            <svg class="pw-icon" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-login">
                    <span>Entrar</span>
                </button>
            </form>

            <div class="card-footer">
                <div class="divider">
                    <span>OU</span>
                </div>
                <a href="esqueci-senha.html" class="forgot-password">Esqueceu sua senha?</a>
            </div>
        </div>

        <div class="signup-box">
            <p class="signup-text">Não possui uma conta?</p>
            <a href="criarconta.html" class="btn-signup" aria-label="Criar conta gratuita">
                <span>Cadastre-se agora</span>
                <svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" width="22" height="22" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
            </a>
            <p class="signup-hint">É grátis e leva menos de 1 minuto</p>
        </div>
    </main>

    <script src="JS/shared.js?v=6"></script>
    <script src="JS/api.js?v=7"></script>
    <script src="JS/login.js?v=6"></script>
</body>
</html>
