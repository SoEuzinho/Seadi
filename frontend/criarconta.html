<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="theme-color" content="#1a1c23">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="format-detection" content="telephone=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>SEADI - Criar conta</title>
    <link rel="stylesheet" href="css/fonts.css">
    <link rel="stylesheet" href="css/auth.css?v=7">
    <link rel="stylesheet" href="css/criarconta.css?v=6">
</head>
<body>

    <div class="ambient-light"></div>

    <main class="main-wrapper">
        <div class="login-card">
            <header class="card-header">
                <img src="img/seadi_1.png" alt="Logo SEADI" class="main-logo">
                <div class="brand-info">
                    <p class="tagline">Educação Digital Inteligente</p>
                    <h1 class="title">Criar conta</h1>
                </div>
            </header>

            <form class="login-form" onsubmit="return false;">
                <div class="success-box" id="success-box"></div>

                <div class="input-group">
                    <label class="field-label" for="nome">Nome <span class="req" aria-hidden="true">*</span></label>
                    <input type="text" id="nome" name="name" placeholder="Digite seu nome completo" required autocomplete="name">
                </div>

                <div class="input-group">
                    <label class="field-label" for="telefone">Telefone <span class="opcional">(opcional)</span></label>
                    <input type="tel" id="telefone" name="phone" placeholder="(00) 00000-0000" maxlength="15" oninput="mascaraTel(this)" autocomplete="tel">
                </div>

                <div class="input-group">
                    <label class="field-label" for="email">Email <span class="req" aria-hidden="true">*</span></label>
                    <input type="email" id="email" name="email" placeholder="Digite seu email" required autocomplete="email" inputmode="email">
                </div>

                <div class="input-group">
                    <label class="field-label" for="pw-nova">Senha <span class="req" aria-hidden="true">*</span></label>
                    <div class="pw-field">
                        <input type="password" id="pw-nova" name="new-password" class="pw-input" placeholder="Crie uma senha" required oninput="checkPw()" autocomplete="new-password">
                        <button type="button" class="pw-toggle" onclick="togglePw('pw-nova')" aria-label="Mostrar senha" title="Mostrar senha" aria-pressed="false" aria-controls="pw-nova">
                            <svg class="pw-icon" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>
                        </button>
                    </div>
                </div>

                <div class="pw-strength" id="pw-strength" style="display:none;">
                    <div class="pw-strength-label" id="pw-strength-label">Força: —</div>
                    <div class="pw-strength-bar">
                        <div class="pw-bar-seg" id="seg1"></div>
                        <div class="pw-bar-seg" id="seg2"></div>
                        <div class="pw-bar-seg" id="seg3"></div>
                        <div class="pw-bar-seg" id="seg4"></div>
                    </div>
                </div>

                <div class="pw-rules">
                    <div class="pw-rule" id="rule-len"><div class="pw-rule-dot"></div>Use pelo menos 4 caracteres.</div>
                </div>

                <div class="input-group">
                    <label class="field-label" for="pw-confirm">Confirmar senha <span class="req" aria-hidden="true">*</span></label>
                    <div class="pw-field">
                        <input type="password" id="pw-confirm" name="new-password" class="pw-input" placeholder="Digite a senha novamente" required oninput="checkConfirm()" autocomplete="new-password">
                        <button type="button" class="pw-toggle" onclick="togglePw('pw-confirm')" aria-label="Mostrar senha" title="Mostrar senha" aria-pressed="false" aria-controls="pw-confirm">
                            <svg class="pw-icon" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>
                        </button>
                    </div>
                </div>
                <span class="form-hint" id="confirm-hint" style="margin-top:-10px;"></span>

                <div class="checkbox-group">
                    <label class="checkbox-label" for="termos">
                        <input type="checkbox" id="termos">
                        <span class="checkbox-box" aria-hidden="true">
                            <svg fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
                        </span>
                        <span class="checkbox-text">
                            Li e aceito os <a href="termos.html" target="_blank" rel="noopener" onclick="abrirLink(this,event)">Termos de uso</a> e a <a href="privacidade.html" target="_blank" rel="noopener" onclick="abrirLink(this,event)">Política de privacidade</a>.
                        </span>
                    </label>
                </div>

                <button type="submit" class="btn-login" onclick="cadastrar()">
                    <span>Criar minha conta</span>
                </button>
            </form>

            <div class="card-footer">
                <div class="divider">
                    <span>OU</span>
                </div>
                <a href="login.html" class="forgot-password">Já tem uma conta? Entrar</a>
            </div>
        </div>
    </main>

    <script src="JS/shared.js?v=6"></script>
    <script src="JS/api.js?v=7"></script>
    <script src="JS/criarconta.js?v=6"></script>
</body>
</html>
