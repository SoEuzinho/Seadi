<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="theme-color" content="#1a1c23">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="format-detection" content="telephone=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>SEADI - Esqueci minha senha</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="css/fonts.css">
    <link rel="stylesheet" href="css/auth.css?v=7">
    <link rel="stylesheet" href="css/esqueci.css?v=6">
</head>
<body>

    <div class="ambient-light"></div>

    <main class="main-wrapper">
        <div class="login-card">
            <header class="card-header">
                <a href="index.html"><img src="img/seadi_1.webp" alt="Logo SEADI" class="main-logo"></a>
                <div class="brand-info">
                    <p class="tagline">Educação Digital Inteligente</p>
                    <h1 class="title">Esqueci minha senha</h1>
                </div>
            </header>

            <p class="auth-sub">Escolha como deseja receber o link de redefinição.</p>

            <div class="tabs">
                <button class="tab active" onclick="trocarAba('email')">E-mail</button>
                <button class="tab" onclick="trocarAba('telefone')">Telefone</button>
            </div>

            <div class="success-box" id="success-box"></div>

            <div class="tab-panel active" id="panel-email">
                <form class="login-form" onsubmit="return false;">
                    <div class="input-group">
                        <label class="field-label" for="email">Email <span class="req" aria-hidden="true">*</span></label>
                        <input type="email" id="email" name="email" placeholder="Digite seu email de cadastro" required autocomplete="email" inputmode="email">
                    </div>
                    <button type="button" class="btn-login" onclick="enviar('email')">
                        <span>Enviar link por email</span>
                    </button>
                </form>
            </div>

            <div class="tab-panel" id="panel-telefone">
                <form class="login-form" onsubmit="return false;">
                    <div class="input-group">
                        <label class="field-label" for="telefone">Telefone <span class="req" aria-hidden="true">*</span></label>
                        <input type="tel" id="telefone" name="phone" placeholder="(00) 00000-0000" maxlength="15" oninput="mascaraTel(this)" required autocomplete="tel">
                    </div>
                    <button type="button" class="btn-login" onclick="enviar('telefone')">
                        <span>Enviar código por SMS</span>
                    </button>
                </form>
            </div>

            <div class="card-footer">
                <div class="divider">
                    <span>OU</span>
                </div>
                <a href="login.html" class="forgot-password">Lembrou a senha? Voltar para o login</a>
            </div>
        </div>
    </main>

    <script src="JS/shared.js?v=6"></script>
    <script src="JS/api.js?v=7"></script>
    <script src="JS/esquecisenha.js?v=6"></script>
</body>
</html>
